name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js logo.svg icon-*.png www/
      - run: npx cap add android
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Apply app icon
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert icon-512.png -resize ${s}x${s} $R/mipmap-$n/$f.png
            done
          done
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: shopping-list-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
